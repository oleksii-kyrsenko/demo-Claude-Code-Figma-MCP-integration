language: en

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
      - main

  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        Review for TypeScript best practices, proper typing, and React patterns.
        Check for missing types, any usage, and unnecessary re-renders.
    - path: 'src/__tests__/**'
      instructions: |
        Ensure tests are meaningful and not just placeholders.
        Check for proper test descriptions and edge case coverage.
    - path: '.github/workflows/**'
      instructions: |
        Review for security best practices, pinned action versions, and proper secret handling.

  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: true
